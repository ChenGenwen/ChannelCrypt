# config/config.yaml
# ============================================================
# VGG16-BN + MNIST 专用配置
# ============================================================

# ============================================================
# 模型配置
# ============================================================
model:
  arch: vgg16_bn
  num_classes: 10                # MNIST: 10个数字类别
  pretrained: false

# ============================================================
# 数据集配置
# ============================================================
dataset:
  name: mnist
  data_dir: D:/Model IP Protection/data
  batch_size: 128                # MNIST较简单，可以用更大的batch
  num_workers: 4
  
  # MNIST标准化参数（灰度图像，单通道）
  mean: [0.1307]
  std: [0.3081]

# ============================================================
# 训练配置
# ============================================================
training:
  # Base模型训练（MNIST很简单，不需要太多轮）
  epochs_base: 30
  lr_base: 0.01
  lr_schedule_base:
    milestones: [15, 25]
    gamma: 0.1
  
  # 同质化微调
  epochs_confuse: 20
  lr_confuse: 0.001
  lr_schedule_confuse:
    milestones: [10, 15]
    gamma: 0.1
  
  # 优化器
  momentum: 0.9
  weight_decay: 0.0005
  
  # 监控
  validate_interval: 1

# ============================================================
# 混淆配置
# ============================================================
confuse:
  key: "4a7d1ed414474e4033ac29ccb8653d9b"
  
  rho: 0.5
  lambda: 0.01
  alpha_hi: 2.0
  alpha_lo: 1.0
  eps: 1e-8
  
  metrics_interval: 5
  acc_penalty: 0.2

# ============================================================
# 路径配置
# ============================================================
paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  
  base_model: base_vgg16bn_mnist.pth
  confuse_model: confuse_vgg16bn_mnist.pth
  locked_model: locked_vgg16bn_mnist.pth
  assembled_model: assembled_vgg16bn_mnist.pth

# ============================================================
# 设备配置
# ============================================================
device:
  cuda: true
  gpu_ids: [0]
  seed: 42