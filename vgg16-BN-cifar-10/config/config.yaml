# config/config.yaml
# ============================================================
# VGG16-BN + CIFAR-10 专用配置
# ============================================================

# ============================================================
# 模型配置
# ============================================================
model:
  arch: vgg16_bn
  num_classes: 10
  pretrained: false              # 不使用ImageNet预训练(从头训练)

# ============================================================
# 数据集配置
# ============================================================
dataset:
  name: cifar10
  data_dir: D:/Model IP Protection/data
  batch_size: 256
  num_workers: 4
  
  # CIFAR-10标准化参数
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2023, 0.1994, 0.2010]

# ============================================================
# 训练配置
# ============================================================
training:
  # Base模型训练
  epochs_base: 200
  lr_base: 0.01                  # VGG通常用较小的初始学习率
  lr_schedule_base:
    milestones: [60, 120, 160]
    gamma: 0.1
  
  # 同质化微调
  epochs_confuse: 40
  lr_confuse: 0.001
  lr_schedule_confuse:
    milestones: [20, 30]
    gamma: 0.1
  
  # 优化器
  momentum: 0.9
  weight_decay: 0.0005
  
  # 监控
  validate_interval: 1

# ============================================================
# 混淆配置
# ============================================================
confuse:
  key: "4a7d1ed414474e4033ac29ccb8653d9b"
  
  rho: 0.5
  lambda: 0.01
  alpha_hi: 2.0
  alpha_lo: 1.0
  eps: 1e-8
  
  # 每多少轮计算一次混淆指标
  metrics_interval: 5

# ============================================================
# 路径配置
# ============================================================
paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  
  base_model: base_vgg16bn_cifar10.pth
  confuse_model: confuse_vgg16bn_cifar10.pth
  locked_model: locked_vgg16bn_cifar10.pth
  assembled_model: assembled_vgg16bn_cifar10.pth

# ============================================================
# 设备配置
# ============================================================
device:
  cuda: true
  gpu_ids: [0]
  seed: 42