# config/config.yaml
# ============================================================
# GoogLeNet + MNIST 专用配置
# ============================================================

# ============================================================
# 模型配置
# ============================================================
model:
  arch: googlenet
  num_classes: 10                    # MNIST是10类(0-9数字)
  pretrained: false                  # 不使用ImageNet预训练(从头训练)

# ============================================================
# 数据集配置
# ============================================================
dataset:
  name: mnist
  data_dir: D:/Model IP Protection/data               # MNIST会自动下载到这里
  batch_size: 128                    # MNIST较简单，可以用更大batch_size
  num_workers: 4
  
  # MNIST标准化参数（单通道灰度图）
  mean: [0.1307]                     # MNIST的均值
  std: [0.3081]                      # MNIST的标准差

# ============================================================
# 训练配置
# ============================================================
training:
  # Base模型训练
  # MNIST比CIFAR简单得多，不需要太多轮数
  epochs_base: 100                   # MNIST通常50-100轮就够了
  lr_base: 0.01                      # MNIST用较小的初始学习率
  lr_schedule_base:
    milestones: [40, 70]             # 提前衰减
    gamma: 0.1
  
  # 同质化微调
  epochs_confuse: 40                 # MNIST微调也不需要太多轮
  lr_confuse: 0.001                  # 微调用更小学习率
  lr_schedule_confuse:
    milestones: [15, 25]             # 更早衰减
    gamma: 0.1
  
  # 优化器
  momentum: 0.9
  weight_decay: 0.0001               # MNIST用较小的weight_decay
  
  # 监控
  validate_interval: 1               # 每轮都验证

# ============================================================
# 混淆配置
# ============================================================
confuse:
  key: "4a7d1ed414474e4033ac29ccb8653d9b"
  
  rho: 0.5
  # MNIST较简单，可能需要更小的lambda
  lambda: 0.003                      # 比CIFAR小，防止过度同质化
  alpha_hi: 2.0
  alpha_lo: 1.0
  eps: 1e-8
  
  # 每多少轮计算一次混淆指标
  metrics_interval: 5

# ============================================================
# 路径配置
# ============================================================
paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  
  base_model: base_googlenet_mnist.pth
  confuse_model: confuse_googlenet_mnist.pth
  locked_model: locked_googlenet_mnist.pth
  assembled_model: assembled_googlenet_mnist.pth

# ============================================================
# 设备配置
# ============================================================
device:
  cuda: true
  gpu_ids: [0]
  seed: 42