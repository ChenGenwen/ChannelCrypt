# config/config.yaml
# ============================================================
# ResNet18 + CIFAR-10 专用配置
# ============================================================

# ============================================================
# 模型配置
# ============================================================
model:
  arch: resnet18
  num_classes: 10
  pretrained: false              # 不使用ImageNet预训练(从头训练)

# ============================================================
# 数据集配置
# ============================================================
dataset:
  name: cifar10
  data_dir: D:/Model IP Protection/data               # CIFAR-10会自动下载到这里
  batch_size: 64
  num_workers: 4
  
  # CIFAR-10标准化参数(ImageNet统计量也常用)
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2023, 0.1994, 0.2010]

# ============================================================
# 训练配置
# ============================================================
training:
  # Base模型训练
  epochs_base: 300              # CIFAR-10从头训练通常需要200轮
  lr_base: 0.1
  lr_schedule_base:
    milestones: [120, 200, 260]      # 第150,225,260轮衰减
    gamma: 0.1
  
  # 同质化微调
  # 原版40轮+milestones[20,30]的问题:
  #   epoch30后有效学习率 = 0.0001*lambda(0.005) = 5e-7,
  #   对同质化目标几乎无梯度信号，无法充分收敛。
  # 修改为80轮，milestones后移，让同质化损失有足够的梯度作用时间。
  epochs_confuse: 60
  lr_confuse: 0.01               # 微调用小学习率
  lr_schedule_confuse:
    milestones: [20, 40]         # 后移，保证前40轮有充分梯度
    gamma: 0.1
  
  # 优化器
  momentum: 0.9
  weight_decay: 0.0005
  
  # 监控
  validate_interval: 1           # 每轮都验证(CIFAR-10很快)

# ============================================================
# 混淆配置
# ============================================================
confuse:
  key: "4a7d1ed414474e4033ac29ccb8653d9b"
  
  rho: 0.5
  # lambda: 0.005
  lambda: 0.01
  alpha_hi: 2.0
  alpha_lo: 1.0
  eps: 1e-8
  
  # 每多少轮计算一次混淆指标
  metrics_interval: 5

# ============================================================
# 路径配置
# ============================================================
paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  
  base_model: base_resnet18_cifar10.pth
  confuse_model: confuse_resnet18_cifar10.pth
  locked_model: locked_resnet18_cifar10.pth
  assembled_model: assembled_resnet18_cifar10.pth

# ============================================================
# 设备配置
# ============================================================
device:
  cuda: true
  gpu_ids: [0]
  seed: 42