# config/config.yaml
# ============================================================
# VGG16-BN + CIFAR-100 专用配置
# ============================================================

# ============================================================
# 模型配置
# ============================================================
model:
  arch: vgg16_bn
  num_classes: 100                # 从10改为100
  pretrained: false

# ============================================================
# 数据集配置
# ============================================================
dataset:
  name: cifar100              
  data_dir: D:/Model IP Protection/data
  batch_size: 256
  num_workers: 4

  mean: [0.5071, 0.4867, 0.4408]  # CIFAR-100的统计量
  std: [0.2675, 0.2565, 0.2761]

# ============================================================
# 训练配置
# ============================================================
training:
  # Base模型训练
  epochs_base: 200                # CIFAR-100通常需要更多轮数
  lr_base: 0.01
  lr_schedule_base:
    milestones: [60, 120, 160]
    gamma: 0.1
  
  # 同质化微调
  epochs_confuse: 5
  lr_confuse: 0.001
  lr_schedule_confuse:
    milestones: []
    gamma: 1.0
  
  # 优化器
  momentum: 0.9
  weight_decay: 0.0005
  
  # 监控
  validate_interval: 1

# ============================================================
# 混淆配置
# ============================================================
confuse:
  key: "4a7d1ed414474e4033ac29ccb8653d9b"
  
  rho: 0.5
  lambda: 0.01
  alpha_hi: 2.0
  alpha_lo: 1.0
  eps: 1e-8
  
  metrics_interval: 5
  acc_penalty: 0.2

# ============================================================
# 路径配置
# ============================================================
paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  
  base_model: base_vgg16bn_cifar100.pth       # 文件名改为cifar100
  confuse_model: confuse_vgg16bn_cifar100.pth
  locked_model: locked_vgg16bn_cifar100.pth
  assembled_model: assembled_vgg16bn_cifar100.pth

# ============================================================
# 设备配置
# ============================================================
device:
  cuda: true
  gpu_ids: [0]
  seed: 42