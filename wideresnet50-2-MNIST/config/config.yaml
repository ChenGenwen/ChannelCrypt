# ============================================================
# WideResNet-50-2 + MNIST 专用配置
# ============================================================

# 模型配置
model:
  arch: wideresnet50_2
  num_classes: 10              # 改: 100 → 10
  pretrained: false

# 数据集配置
dataset:
  name: mnist                  # 改: cifar100 → mnist
  data_dir: ./data             # MNIST会自动下载
  batch_size: 128
  num_workers: 4
  
  # MNIST标准化参数（灰度图，单通道）
  mean: [0.1307]               # 改: RGB → 灰度
  std: [0.3081]                # 改: RGB → 灰度

# 训练配置
training:
  # Base模型训练
  epochs_base: 50            
  lr_base: 0.001
  lr_schedule_base:
    milestones: [20, 35]       # 改: 调整衰减点
    gamma: 0.1

  # 同质化微调
  epochs_confuse: 20     
  lr_confuse: 0.0001
  lr_schedule_confuse:
    milestones: [10, 15]       # 改: 调整衰减点
    gamma: 0.1
  
  weight_decay: 0.0005
  validate_interval: 1

# 混淆配置（保持不变）
confuse:
  key: "4a7d1ed414474e4033ac29ccb8653d9b"
  rho: 0.5
  lambda: 0.005
  alpha_hi: 3.0
  alpha_lo: 1.0
  eps: 1e-8
  metrics_interval: 5

# 路径配置
paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  
  base_model: base_wideresnet50_2_mnist.pth        # 改: 文件名
  confuse_model: confuse_wideresnet50_2_mnist.pth  # 改: 文件名
  locked_model: locked_wideresnet50_2_mnist.pth    # 改: 文件名
  assembled_model: assembled_wideresnet50_2_mnist.pth  # 改: 文件名

# 设备配置（保持不变）
device:
  cuda: true
  gpu_ids: [0]
  seed: 42