# config/config.yaml
# ============================================================
# ResNet18 + MNIST 专用配置
# ============================================================

# ============================================================
# 模型配置
# ============================================================
model:
  arch: resnet18
  num_classes: 10
  pretrained: false              # 不使用ImageNet预训练(从头训练)
  input_channels: 1              # MNIST 是单通道灰度图

# ============================================================
# 数据集配置
# ============================================================
dataset:
  name: mnist
  data_dir: D:/Model IP Protection/data             # MNIST会自动下载到这里
  batch_size: 256                # MNIST很小，可以用更大batch
  num_workers: 4
  
  # MNIST 归一化参数（单通道）
  mean: [0.1307]                 # MNIST标准均值
  std: [0.3081]                  # MNIST标准标准差

# ============================================================
# 训练配置
# ============================================================
training:
  # Base模型训练
  epochs_base: 100               # MNIST训练通常100轮足够
  lr_base: 0.1
  lr_schedule_base:
    milestones: [40, 70]         # 第40,70轮衰减
    gamma: 0.1
  
  # 同质化微调
  epochs_confuse: 40             # 微调40轮
  lr_confuse: 0.01               # 微调用小学习率
  lr_schedule_confuse:
    milestones: [10, 25]         # 第10,25轮衰减
    gamma: 0.1
  
  # 优化器
  momentum: 0.9
  weight_decay: 0.0001           # MNIST用较小的weight_decay
  
  # 监控
  validate_interval: 1           # 每轮都验证(MNIST很快)

# ============================================================
# 混淆配置
# ============================================================
confuse:
  key: "4a7d1ed414474e4033ac29ccb8653d9b"
  
  rho: 0.5                       # 50%的块参与置换
  lambda: 0.01                   # 同质化损失权重
  alpha_hi: 2.0                  # 选中块的拉近权重
  alpha_lo: 1.0                  # 未选中块的拉近权重
  eps: 1e-8                      # 数值稳定性常数
  
  # 每多少轮计算一次混淆指标
  metrics_interval: 5

# ============================================================
# 路径配置
# ============================================================
paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  
  base_model: base_resnet18_mnist.pth
  confuse_model: confuse_resnet18_mnist.pth
  locked_model: locked_resnet18_mnist.pth
  assembled_model: assembled_resnet18_mnist.pth

# ============================================================
# 设备配置
# ============================================================
device:
  cuda: true
  gpu_ids: [0]
  seed: 42