# config/config.yaml
# ============================================================
# WideResNet-50-2 + CIFAR-10 专用配置
# 优化器：Adam（已移除 momentum 参数）
# ============================================================

# ============================================================
# 模型配置
# ============================================================
model:
  arch: wideresnet50_2
  num_classes: 10
  pretrained: false              # 不使用ImageNet预训练(从头训练)

# ============================================================
# 数据集配置
# ============================================================
dataset:
  name: cifar10
  data_dir: D:/Model IP Protection/data               # CIFAR-10会自动下载到这里
  batch_size: 256                # WRN50-2较大，减小batch size避免OOM
  num_workers: 4
  
  # CIFAR-10标准化参数
  mean: [0.4914, 0.4822, 0.4465] 
  std: [0.2470, 0.2435, 0.2616]

# ============================================================
# 训练配置
# ============================================================
training:
  # Base模型训练
  epochs_base: 100              # WRN50-2收敛较慢，建议200轮
  lr_base: 0.001                 # Adam 推荐学习率（比SGD小一个数量级）
  lr_schedule_base:
    milestones: [30, 70]   # 学习率衰减点
    gamma: 0.1                   # 每次衰减为原来的0.1倍

  # 同质化微调
  epochs_confuse: 40
  lr_confuse: 0.0001             # 微调用更小学习率（Adam）
  lr_schedule_confuse:
    milestones: [15,25]        
    gamma: 0.1
  
  # 优化器（Adam不需要momentum）
  weight_decay: 0.0005           # WRN50-2较大，适当增加正则化
  
  # 监控
  validate_interval: 1           # 每轮都验证

# ============================================================
# 混淆配置
# ============================================================
confuse:
  key: "4a7d1ed414474e4033ac29ccb8653d9b"
  
  rho: 0.5                       # 选块比例
  lambda: 0.005                  # 同质化损失权重（WRN50-2通道多，用较小值）
  alpha_hi: 3.0                  # 选中块的拉近权重
  alpha_lo: 1.0                  # 未选中块的拉近权重
  eps: 1e-8
  
  # 每多少轮计算一次混淆指标
  metrics_interval: 5

# ============================================================
# 路径配置
# ============================================================
paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  
  base_model: base_wideresnet50_2_cifar10.pth
  confuse_model: confuse_wideresnet50_2_cifar10.pth
  locked_model: locked_wideresnet50_2_cifar10.pth
  assembled_model: assembled_wideresnet50_2_cifar10.pth

# ============================================================
# 设备配置
# ============================================================
device:
  cuda: true
  gpu_ids: [0]
  seed: 42